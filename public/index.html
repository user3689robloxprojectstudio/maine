<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HYPERCHEAT // Public Script Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #09090b;
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.15), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12), transparent 35%);
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .card {
      background: rgba(24, 24, 27, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card:hover {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.14);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Navbar -->
  <header class="border-b border-white/10 bg-zinc-950/85 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <img
          src="/H.jpg"
          alt="HyperCheat"
          class="w-9 h-9 rounded-lg object-cover border border-white/15 bg-zinc-900"
          onerror="this.style.display='none'; document.getElementById('iconFallback').classList.remove('hidden');"
        />
        <div
          id="iconFallback"
          class="hidden w-9 h-9 rounded-lg bg-gradient-to-br from-violet-600 to-cyan-500 flex items-center justify-center font-bold text-white mono"
        >
          H
        </div>
        <span class="font-bold tracking-wider text-lg">HYPER<span class="text-violet-400">CHEAT</span></span>
      </div>

      <div class="flex items-center gap-2.5">
        <a href="https://discord.gg/your-invite" target="_blank" rel="noopener noreferrer"
           class="px-3.5 py-1.5 rounded-lg bg-[#5865F2]/15 hover:bg-[#5865F2]/25 text-[#9aa8f5] border border-[#5865F2]/35 text-xs sm:text-sm font-medium transition">
          Discord
        </a>
        <a href="https://youtube.com/@your-channel" target="_blank" rel="noopener noreferrer"
           class="px-3.5 py-1.5 rounded-lg bg-red-500/15 hover:bg-red-500/25 text-red-400 border border-red-500/35 text-xs sm:text-sm font-medium transition">
          YouTube
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl w-full mx-auto px-6 py-12 flex-1">
    <div class="mb-8">
      <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-2">
        HyperCheat <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-cyan-400">Scripts</span>
      </h1>
      <p class="text-zinc-400 text-sm md:text-base">
        Choose a script below and complete the countdown to get your loadstring.
      </p>

      <input
        id="searchInput"
        type="text"
        placeholder="Search scripts..."
        class="mt-5 w-full max-w-md bg-zinc-900/90 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-violet-500 transition"
      />
    </div>

    <div id="scriptGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="card rounded-2xl p-6 text-sm text-zinc-400 col-span-full">Loading scripts...</div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-white/10 py-6 text-center text-xs text-zinc-500">
    HYPERCHEAT &copy; 2026 &bull; Public Script Library
  </footer>

  <script>
    let allScripts = [];

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadScripts() {
      const grid = document.getElementById('scriptGrid');
      try {
        const res = await fetch('/api/list', { cache: 'no-store' });
        allScripts = await res.json();
        renderScripts();
      } catch {
        grid.innerHTML = `<div class="card rounded-2xl p-6 text-sm text-red-400 col-span-full">Unable to load scripts right now.</div>`;
      }
    }

    function renderScripts() {
      const grid = document.getElementById('scriptGrid');
      const query = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allScripts.filter((s) =>
        s.name.toLowerCase().includes(query) ||
        s.description.toLowerCase().includes(query)
      );

      if (!filtered.length) {
        grid.innerHTML = `
          <div class="card rounded-2xl p-6 col-span-full">
            <p class="text-sm font-medium text-zinc-200">No scripts available right now.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map((s) => {
        const iconHtml = s.iconUrl
          ? `<img src="${escapeHtml(s.iconUrl)}" alt="${escapeHtml(s.name)}" class="w-11 h-11 rounded-xl object-cover border border-white/10 shrink-0" />`
          : `<div class="w-11 h-11 rounded-xl bg-violet-500/15 border border-violet-500/25 flex items-center justify-center text-violet-300 font-bold mono shrink-0">HC</div>`;

        return `
          <div class="card rounded-2xl p-5 flex flex-col justify-between transition duration-200">
            <div>
              <div class="flex items-start justify-between gap-3 mb-3">
                <div class="flex items-center gap-3 min-w-0">
                  ${iconHtml}
                  <div class="min-w-0">
                    <h2 class="text-lg font-semibold text-white truncate">${escapeHtml(s.name)}</h2>
                  </div>
                </div>
                <span class="text-xs text-zinc-500 mono shrink-0">${escapeHtml(s.size)}</span>
              </div>
              <p class="text-xs text-zinc-400 leading-relaxed">${escapeHtml(s.description)}</p>
            </div>

            <div class="mt-5 pt-4 border-t border-white/5">
              <a href="${escapeHtml(s.verifyUrl)}"
                 class="block text-center w-full bg-gradient-to-r from-violet-600 to-cyan-600 hover:opacity-90 text-white text-xs font-semibold py-2.5 px-3 rounded-xl transition">
                Get Loadstring
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderScripts);

    loadScripts();
  </script>
</body>
</html>
